# Local development database
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: tavi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tavi
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavi -d tavi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db_data:
