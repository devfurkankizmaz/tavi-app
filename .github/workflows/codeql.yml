# Static analysis for the JavaScript/TypeScript sources and the workflows
# themselves. Results appear under the repository's Security tab.
#
# Kept as a workflow rather than GitHub's default setup so that it is visible,
# reviewable, and runs the same way on a fork.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an advisory published after a commit landed is still caught
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # No build step: both languages are analysed from source
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
